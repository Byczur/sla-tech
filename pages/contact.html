<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="description" content="Skontaktuj się z SLA-TECH - doradztwo techniczne i oferty armatury przemysłowej.">
  <title>Kontakt — SLA-TECH</title>
  <link rel="stylesheet" href="../styles/styles.css" />
  <link rel="preload" as="image" href="../images/background.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preload" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" as="style">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" href="../images/favicon.png">
  <meta property="og:title" content="SLA-TECH - dystrybucja armatury przemysłowej" />
  <meta property="og:url" content="https://www.slatech.pl/pages/contact.html" />
  <link rel="canonical" href="https://www.slatech.pl/pages/contact.html" />
  <link rel="apple-touch-icon" href="../images/favicon.png">
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="../index.html">
        <img src="../images/logo sla tech new.png" alt="Logo firmy" class="logo" height="58px" width="196px">
      </a>
      <button class="nav-toggle" aria-label="Menu">☰</button>
      <nav class="main-nav">
        <ul>
          <li><a href="../index.html" data-i18n="nav.home">Strona główna</a></li>
          <li><a href="about.html" data-i18n="nav.about">O firmie</a></li>
          <li><a href="products.html" data-i18n="nav.products">Produkty</a></li>
          <li><a href="contact.html" data-i18n="nav.contact">Kontakt</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main>
    <div class="container">
      <div class="contact-box">
        <h2 data-i18n="contact.h2">Kontakt</h2>
        <hr />
        <section class="contact-info">
          <p><strong>SLA-TECH</strong> Sławomir Sersan</p>
          <p><strong data-i18n="contact.address.label">Adres:</strong> ul. Polaczka 6B/4, 41-106 Siemianowice Śląskie</p>
          <p><strong data-i18n="contact.email.label">E-mail:</strong> <a href="mailto:slatech@op.pl">slatech@op.pl</a></p>
          <p><strong data-i18n="contact.phone.label">Telefon:</strong> <a href="tel:+48663345945">+48 663 345 945</a></p>
          <p><strong data-i18n="contact.nip.label">NIP:</strong> 627-135-31-56</p>
        </section>
        <hr />
        <section class="contact-form">
          <h3 class="wyslij" data-i18n="contact.form.h3">Wyślij zapytanie</h3>
          <form action="https://formsubmit.co/slatech@op.pl" method="POST">
            <input type="hidden" name="_subject" value="Nowe zapytanie ze strony SLA-TECH!">
            <input type="hidden" name="_captcha" value="false">
            <label>
              <span data-i18n="contact.form.name">Imię i nazwisko</span><br />
              <input type="text" name="Imie" required />
            </label>
            <label>
              <span data-i18n="contact.form.company">Firma</span><br />
              <input type="text" name="Firma" />
            </label>
            <label>
              <span data-i18n="contact.form.email">E-mail</span><br />
              <input type="email" name="Email" required />
            </label>
            <label>
              <span data-i18n="contact.form.phone">Telefon</span><br />
              <input type="tel" name="Telefon" />
            </label>
            <label>
              <span data-i18n="contact.form.message">Treść zapytania</span><br />
              <textarea name="Wiadomosc" rows="6" required></textarea>
            </label>
            <div class="form-actions">
              <button type="submit" class="btn btn-send" data-i18n="contact.form.send">Wyślij</button>
              <button type="reset" class="btn btn-clear" data-i18n="contact.form.clear">Wyczyść</button>
            </div>
          </form>
        </section>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <p>&copy; <span id="year"></span> SLA-TECH</p>
      <nav class="footer-nav">
        <a href="../index.html" data-i18n="nav.home">Strona główna</a>
        <a href="about.html" data-i18n="nav.about">O firmie</a>
        <a href="products.html" data-i18n="nav.products">Produkty</a>
      </nav>
    </div>
  </footer>

  <script src="../scripts/script.js"></script>
</body>
</html>
